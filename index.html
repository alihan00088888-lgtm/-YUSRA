<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSRA - Калькулятор</title>
    <style>
        :root {
            --primary: #00a884;
            --primary-light: #dcf8c6;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #111b21;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: var(--card); width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-bottom: 5px; color: var(--primary); }
        .subtitle { text-align: center; font-size: 14px; color: #667781; margin-bottom: 20px; }
        .mode-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 10px; border: none; background: #e9edef; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .mode-btn.active { background: var(--primary); color: white; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; color: #667781; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .result-box { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px solid #e9edef; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .action-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; color: white; text-align: center; }
        .btn-copy { background: #333; }
        .btn-whatsapp { background: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>YUSRA</h1>
    <div class="subtitle">Калькулятор рассрочки</div>

    <div class="mode-buttons">
        <button id="btnWithVznos" class="mode-btn active" onclick="setMode(true)">Со взносом</button>
        <button id="btnNoVznos" class="mode-btn" onclick="setMode(false)">Без взноса</button>
    </div>

    <div class="form-group">
        <label>Себестоимость (₽):</label>
        <input type="number" id="costPrice" value="100000" oninput="onCostChange()">
    </div>

    <div class="form-group">
        <label>Срок рассрочки:</label>
        <select id="months" onchange="calculate()">
            <option value="3" selected>3 месяца</option>
            <option value="6">6 месяцев</option>
            <option value="12">12 месяцев</option>
        </select>
    </div>

    <div class="form-group" id="vznosGroup">
        <label>Первоначальный взнос (₽):</label>
        <input type="number" id="vznos" value="20000" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-row"><span>Себестоимость:</span> <b id="resCost">0 ₽</b></div>
        <div class="result-row" id="resVznosRow"><span>Первый взнос:</span> <b id="resVznos">0 ₽</b></div>
        <div class="result-row"><span>Платеж:</span> <b id="resMonthly">0 ₽</b></div>
        <div class="result-row"><span>Итого:</span> <b id="resTotal">0 ₽</b></div>
        <div class="result-row"><span>Переплата:</span> <b id="resOverpay">0 ₽</b></div>
    </div>

    <div class="actions">
        <button class="action-btn btn-copy" onclick="copyResult()">Копировать</button>
        <button class="action-btn btn-whatsapp" onclick="shareWhatsApp()">WhatsApp</button>
    </div>
</div>

<script>
    let withVznos = true;
    function setMode(status) {
        withVznos = status;
        document.getElementById('btnWithVznos').classList.toggle('active', status);
        document.getElementById('btnNoVznos').classList.toggle('active', !status);
        document.getElementById('vznosGroup').style.display = status ? 'block' : 'none';
        document.getElementById('resVznosRow').style.display = status ? 'flex' : 'none';
        onCostChange();
    }
    function onCostChange() {
        if (withVznos) document.getElementById('vznos').value = Math.round(parseFloat(document.getElementById('costPrice').value) * 0.2) || 0;
        calculate();
    }
    function calculate() {
        let cost = parseFloat(document.getElementById('costPrice').value)||0;
        let months = parseInt(document.getElementById('months').value)||3;
        let vznos = withVznos ? (parseFloat(document.getElementById('vznos').value)||0) : 0;
        let percent = withVznos ? (months == 3 ? 12 : months == 6 ? 18 : 35) : (months == 3 ? 18 : months == 6 ? 25 : 45);
        let totalCost = cost + (Math.max(cost - vznos, 0) * (percent / 100));
        let monthly = Math.round((totalCost - vznos) / months / 50) * 50;
        let finalTotal = vznos + (monthly * months);
        document.getElementById('resCost').innerText = cost.toLocaleString() + ' ₽';
        document.getElementById('resVznos').innerText = vznos.toLocaleString() + ' ₽';
        document.getElementById('resMonthly').innerText = monthly.toLocaleString() + ' ₽';
        document.getElementById('resTotal').innerText = finalTotal.toLocaleString() + ' ₽';
        document.getElementById('resOverpay').innerText = (finalTotal - cost).toLocaleString() + ' ₽';
    }
    function getResultText() {
        return `Расчет рассрочки YUSRA:\nСебестоимость: ${document.getElementById('resCost').innerText}\n${withVznos ? 'Первый взнос: '+document.getElementById('resVznos').innerText+'\n' : ''}Ежемесячный платеж: ${document.getElementById('resMonthly').innerText}\nИтоговая стоимость: ${document.getElementById('resTotal').innerText}\nПереплата: ${document.getElementById('resOverpay').innerText}`;
    }
    function copyResult() { navigator.clipboard.writeText(getResultText()); }
    function shareWhatsApp() { window.location.href = `whatsapp://send?text=${encodeURIComponent(getResultText())}`; }
    calculate();
</script>
</body>
</html>
